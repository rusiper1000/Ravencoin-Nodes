name: Crawl Ravencoin Network

on:
  schedule:
    # UTC 기준 4시간마다 (한국시간 4시간마다와 동일한 간격)
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 크롤러 실행
        run: python crawler.py

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "raven-node-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --quiet --cached || git commit -m "chore: update node data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
